<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Classifier</title>
    <!-- ฟอนต์ภาษาไทยสวยๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #2d3748;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* ซ่อน input file เดิม */
        input[type="file"] {
            display: none;
        }

        /* ตกแต่งปุ่มอัปโหลด */
        .upload-btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .upload-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .upload-btn.disabled {
            background: #a0aec0;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        /* พื้นที่แสดงภาพตัวอย่าง */
        .image-preview-box {
            margin: 24px auto;
            width: 100%;
            height: 250px;
            border: 2px dashed #cbd5e0;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #f8fafc;
            position: relative;
        }

        .image-preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            color: #a0aec0;
            font-size: 0.9rem;
        }

        /* ส่วนแสดงผลลัพธ์และแถบเปอร์เซ็นต์ */
        #label-container {
            text-align: left;
            margin-top: 20px;
        }

        .result-item {
            margin-bottom: 14px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .progress-bg {
            width: 100%;
            height: 10px;
            background-color: #edf2f7;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            border-radius: 999px;
            width: 0%;
            transition: width 0.5s ease-out;
        }

        .status-text {
            font-size: 0.85rem;
            color: #4f46e5;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>วิเคราะห์รูปภาพด้วย AI</h1>
        <p class="subtitle">อัปโหลดรูปภาพ 1 รูปเพื่อให้โมเดลประมวลผล</p>

        <!-- ปุ่มอัปโหลดไฟล์ -->
        <label for="imageUpload" id="uploadBtn" class="upload-btn disabled">
            กำลังโหลดโมเดล...
        </label>
        <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">

        <!-- กล่องแสดงรูปภาพ -->
        <div class="image-preview-box">
            <span class="placeholder-text" id="placeholderText">ยังไม่ได้เลือกรูปภาพ</span>
            <img id="imagePreview" src="" alt="Uploaded Image">
        </div>

        <!-- กล่องแสดงผลลัพธ์การทำนาย -->
        <div id="label-container"></div>
    </div>

    <!-- Scripts ของ TensorFlow และ Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
   
    <script type="text/javascript">
        // ลิงก์โมเดลของคุุณ
        const URL = "https://teachablemachine.withgoogle.com/models/BEX6nVcT_/";

        let model, labelContainer, maxPredictions;

        // โหลดโมเดลทันทีที่เปิดหน้าเว็บ
        async function loadModel() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // เปิดใช้งานปุ่มอัปโหลดเมื่อโหลดโมเดลเสร็จ
                const uploadBtn = document.getElementById("uploadBtn");
                uploadBtn.innerText = "📁 เลือกรูปภาพ";
                uploadBtn.classList.remove("disabled");

                // เตรียมพื้นที่แสดงผลลัพธ์
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "result-item";
                    itemDiv.innerHTML = `
                        <div class="result-header">
                            <span class="class-name">-</span>
                            <span class="class-prob">0%</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: 0%"></div>
                        </div>
                    `;
                    labelContainer.appendChild(itemDiv);
                }
            } catch (error) {
                console.error("Error loading model:", error);
                document.getElementById("uploadBtn").innerText = "โหลดโมเดลไม่สำเร็จ";
            }
        }

        // ฟังก์ชันจัดการเมื่อผู้ใช้เลือกไฟล์ภาพ
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById("imagePreview");
                const placeholder = document.getElementById("placeholderText");

                imgElement.src = e.target.result;
                imgElement.style.display = "block";
                placeholder.style.display = "none";

                // รอให้รูปภาพโหลดลงบนหน้าเว็บเสร็จสมบูรณ์ก่อนส่งให้โมเดลทำนาย
                imgElement.onload = async function() {
                    await predict(imgElement);
                };
            };
            reader.readAsDataURL(file);
        }

        // ฟังก์ชันทำนายผลจากรูปภาพ
        async function predict(imageElement) {
            const prediction = await model.predict(imageElement);
           
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = (prediction[i].probability * 100).toFixed(1); // แปลงเป็นเปอร์เซ็นต์

                const itemDiv = labelContainer.childNodes[i];
                itemDiv.querySelector(".class-name").innerText = className;
                itemDiv.querySelector(".class-prob").innerText = probability + "%";
                itemDiv.querySelector(".progress-fill").style.width = probability + "%";
            }
        }

        // เรียกใช้งานฟังก์ชันโหลดโมเดล
        window.onload = loadModel;
    </script>

</body>
</html>
